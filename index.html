     Space Miner
     Main HTML
=========================================== -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Space Miner</title>


    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<canvas id="gameCanvas"></canvas>



<div id="hud">

    <div>
        <strong>Space Miner</strong>
    </div>


    <div>
        Money:
        <span id="money">$0</span>
    </div>


    <div>
        Ore:
        <span id="ore">0</span>
    </div>


    <div>
        FPS:
        <span id="fps">0</span>
    </div>


    <div>
        Zoom:
        <span id="zoom">1x</span>
    </div>

</div>




<div id="buildingPanel">


    <h2 id="buildingName">
        No Selection
    </h2>


    <p id="buildingInfo">
        Click a building
    </p>


</div>




<div id="loading">

    Loading Space Miner...

</div>



<script type="module" src="js/main.js"></script>


</body>

</html>
